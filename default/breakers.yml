CyberArk_Audit:
  lib: custom
  minRawLength: 256
  rules:
    - condition: source.endsWith('stream/results')
      type: json_array
      timestampAnchorRegex: /timestamp/
      timestamp:
        type: auto
        length: 150
      timestampTimezone: UTC
      timestampEarliest: -420weeks
      timestampLatest: +1week
      maxEventBytes: 512000
      disabled: false
      parserEnabled: false
      shouldUseDataRaw: false
      jsonExtractAll: false
      delimiter: ","
      quoteChar: '"'
      escapeChar: '"'
      delimiterRegex: /\t/
      fieldsLineRegex: /^#[Ff]ields[:]?\s+(.*)/
      headerLineRegex: /^#/
      nullFieldVal: "-"
      cleanFields: true
      eventBreakerRegex: /[\n\r]+(?!\s)/
      name: audit_logs
      jsonArrayField: data
  tags: cyberark,idira
  description: Breaker for Idira Audit Service events (legacy; retained for
    compatibility — cyberark_audit_logs uses CyberArk_API_Ruleset)
CyberArk_API_Ruleset:
  lib: custom
  minRawLength: 256
  rules:
    - condition: /^{"data":\[/.test(_raw)
      type: json_array
      timestampAnchorRegex: /"timestamp"/
      timestamp:
        type: auto
        length: 150
      timestampTimezone: UTC
      timestampEarliest: -420weeks
      timestampLatest: +1week
      maxEventBytes: 5120000
      disabled: false
      parserEnabled: false
      shouldUseDataRaw: false
      jsonExtractAll: false
      delimiter: ","
      quoteChar: '"'
      escapeChar: '"'
      delimiterRegex: /\t/
      fieldsLineRegex: /^#[Ff]ields[:]?\s+(.*)/
      headerLineRegex: /^#/
      nullFieldVal: "-"
      cleanFields: true
      eventBreakerRegex: /[\n\r]+(?!\s)/
      name: audit_logs
      jsonArrayField: data
  tags: cyberark,idira
  description: Breakers for Idira Audit Service (SIEM integration) events
