cyberark_identity_logs:
  type: collection
  ttl: 4h
  ignoreGroupJobsLimit: false
  removeFields: []
  resumeOnBoot: false
  schedule:
    cronSchedule: 5/5 * * * *
    maxConcurrentRuns: 1
    skippable: true
    run:
      rescheduleDroppedTasks: true
      maxTaskReschedule: 1
      logLevel: info
      jobTimeout: 60m
      mode: run
      timeRangeType: relative
      timeWarning: {}
      expression: "true"
      minTaskSize: 1MB
      maxTaskSize: 10MB
      stateTracking:
        stateUpdateExpression: "__timestampExtracted !== false && {latestTime:
          (state.latestTime || 0) > _time ? state.latestTime : _time}"
        stateMergeExpression: "(prevState.latestTime || 0) > newState.latestTime ?
          prevState : newState"
        enabled: true
    enabled: false
  streamtags: []
  workerAffinity: false
  collector:
    conf:
      discovery:
        discoverType: none
      collectMethod: post_with_body
      pagination:
        type: request_page
        pageField: page
        sizeField: page_size
        size: 1000
        maxPages: 0
        zeroIndexed: false
        attribute: []
        totalRecordField: Result.Count
        page: 0
      authentication: login
      timeout: 0
      useRoundRobinDns: false
      disableTimeFilter: false
      decodeUrl: false
      rejectUnauthorized: true
      captureHeaders: false
      stopOnEmptyResults: true
      safeHeaders:
        - X-IDAP-NATIVE-CLIENT
      retryRules:
        type: backoff
        interval: 1000
        limit: 5
        multiplier: 2
        maxIntervalMs: 20000
        codes:
          - 429
          - 503
        enableHeader: true
        retryConnectTimeout: false
        retryConnectReset: false
        retryHeaderName: retry-after
      __scheduling:
        stateTracking:
          stateFileId: cyberark_audit_state
          jobAttribute: _last_collection_time
          initialValue: "'2026-01-01T00:00:00Z'"
          updateExpression: WhenOccurred
          mergeExpression: "(state > value) ? state : value"
      loginUrl: "`https://${C.vars['CyberArk_Hosts'].identity_host}/oauth2/token/crib\
        l_identity_app`"
      loginBody: "`grant_type=client_credentials&scope=cribl&client_id=${C.Secret('cy\
        berark_api_key',
        'keypair').apiKey}&client_secret=${C.Secret('cyberark_api_key',
        'keypair').secretKey}`"
      getAuthTokenFromHeader: false
      authHeaderKey: Authorization
      authHeaderExpr: "`Bearer ${token.trim()}`"
      tokenRespAttribute: access_token
      collectUrl: "`https://${C.vars['CyberArk_Hosts'].identity_host}/Redrock/query`"
      collectBody: |-
        `{
          "Script": "Select * FROM Event WHERE WhenOccurred >= '${C.Time.strftime((earliest || (state.latestTime+.001).toPrecision(13)), "%Y-%m-%dT%H:%M:%S.%LZ")}' AND WhenOccurred < '${C.Time.strftime((latest || Date.now()/1000-1), "%Y-%m-%dT%H:%M:%S.%LZ")}' ORDER BY WhenOccurred ASC",
          "Args": { 
            "PageNumber": ${(page > 0) ? Number.parseInt(page) : 0}, 
            "Limit": 1000
          }
        }`
      collectRequestHeaders:
        - name: X-IDAP-NATIVE-CLIENT
          value: changeme
      username: changeme
      password: changeme
      authRequestHeaders: []
    destructive: false
    encoding: utf8
    type: rest
  input:
    type: collection
    staleChannelFlushMs: 10000
    sendToRoutes: true
    preprocess:
      disabled: true
    throttleRatePerSec: "0"
    breakerRulesets:
      - CyberArk_API_Ruleset
  savedState:
    restCollectorState:
      data:
        latestTime: 1770403201.155
  notifications: []
cyberark_audit_logs:
  type: collection
  ttl: 4h
  ignoreGroupJobsLimit: false
  removeFields: []
  resumeOnBoot: false
  schedule:
    cronSchedule: "*/5 * * * *"
    maxConcurrentRuns: 1
    skippable: true
    run:
      rescheduleDroppedTasks: true
      maxTaskReschedule: 1
      logLevel: info
      jobTimeout: 60m
      mode: run
      timeRangeType: relative
      timeWarning: {}
      expression: "true"
      minTaskSize: 1MB
      maxTaskSize: 10MB
      stateTracking:
        stateUpdateExpression: "__timestampExtracted !== false && {latestTime:
          (state.latestTime || 0) > _time ? state.latestTime : _time}"
        stateMergeExpression: "(prevState.latestTime || 0) > newState.latestTime ?
          prevState : newState"
        enabled: true
    enabled: false
  streamtags: []
  workerAffinity: false
  collector:
    conf:
      discovery:
        discoverType: http
        discoverMethod: post_with_body
        pagination:
          type: none
        enableStrictDiscoverParsing: false
        enableDiscoverCode: false
        itemList: []
        discoverUrl: "`https://${C.vars['CyberArk_Hosts'].audit_host}/api/audits/stream\
          /createQuery`"
        discoverRequestHeaders:
          - name: x-api-key
            value: changeme
        discoverBody: '{"query": {"pageSize": 500,"selectedFields":
          ["tenant_id","custom_data","arrival_timestamp","checksum","application_code","audit_code","timestamp","user_id","session_id","source","action_type","audit_type","component","target","command","message","username","action","uuid","service_name","cloud_roles","cloud_workspaces","cloud_workspaces_and_roles","cloud_assets","cloud_identities","vaulted_accounts","cloud_provider","account_name","target_platform","safe","target_account","identity_type","access_method","account_id","correlation_id"],"filterModel":
          {"date": {"dateFrom": C.Time.strftime((earliest ||
          (state.latestTime+.001).toPrecision(13)), "%Y-%m-%d
          %H:%M:%S.%LZ"),"dateTo": C.Time.strftime((latest ||
          Date.now()/1000-1), "%Y-%m-%d %H:%M:%S.%LZ")}}}}'
      collectMethod: post_with_body
      pagination:
        type: none
        maxPages: 50
        pageField: page
        sizeField: size
        size: 50
        zeroIndexed: false
        offsetField: offset
        limitField: limit
        limit: 50
        nextRelationAttribute: next
      authentication: oauth
      timeout: 0
      useRoundRobinDns: false
      disableTimeFilter: false
      decodeUrl: false
      rejectUnauthorized: true
      captureHeaders: false
      stopOnEmptyResults: true
      safeHeaders: []
      retryRules:
        type: backoff
        interval: 1000
        limit: 5
        multiplier: 2
        maxIntervalMs: 20000
        codes:
          - 429
          - 503
        enableHeader: true
        retryConnectTimeout: false
        retryConnectReset: false
        retryHeaderName: retry-after
      __scheduling:
        stateTracking: {}
      loginUrl: "`https://${C.vars['CyberArk_Hosts'].identity_host}/oauth2/token/crib\
        l_audit_app`"
      authHeaderKey: Authorization
      authHeaderExpr: "`Bearer ${token}`"
      clientSecretParamName: grant_type
      clientSecretParamValue: changeme
      authRequestParams:
        - name: scope
          value: '"isp.audit.events:read"'
      authRequestHeaders:
        - name: Authorization
          value: changeme
      tokenRespAttribute: access_token
      collectUrl: "`https://${C.vars['CyberArk_Hosts'].audit_host}/api/audits/stream/\
        results`"
      collectRequestHeaders:
        - name: x-api-key
          value: changeme
      collectBody: 'JSON.parse(`{ "cursorRef" : "${cursorRef}"}`)'
    destructive: false
    encoding: utf8
    type: rest
  input:
    type: collection
    staleChannelFlushMs: 10000
    sendToRoutes: true
    preprocess:
      disabled: true
    throttleRatePerSec: "0"
    breakerRulesets:
      - CyberArk_API_Ruleset
  savedState:
    restCollectorState:
      data:
        latestTime: 1770393307.321
  notifications: []
  description: This collector collects from the Audit app of CyberArk using the
    SIEM Integration API
