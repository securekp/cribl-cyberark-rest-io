cyberark_audit_logs:
  type: collection
  ttl: 4h
  ignoreGroupJobsLimit: false
  removeFields: []
  resumeOnBoot: false
  schedule:
    cronSchedule: "*/5 * * * *"
    maxConcurrentRuns: 1
    skippable: true
    run:
      rescheduleDroppedTasks: true
      maxTaskReschedule: 1
      logLevel: info
      jobTimeout: 60m
      mode: run
      timeRangeType: relative
      timeWarning: {}
      expression: "true"
      minTaskSize: 1MB
      maxTaskSize: 10MB
      stateTracking:
        stateUpdateExpression: "__timestampExtracted !== false && {latestTime:
          (state.latestTime || 0) > _time ? state.latestTime : _time}"
        stateMergeExpression: "(prevState.latestTime || 0) > newState.latestTime ?
          prevState : newState"
        enabled: true
    enabled: false
  streamtags: []
  workerAffinity: false
  collector:
    conf:
      discovery:
        discoverType: http
        discoverMethod: post_with_body
        pagination:
          type: none
        enableStrictDiscoverParsing: false
        enableDiscoverCode: false
        itemList: []
        discoverUrl: "`https://${C.vars['CyberArk_Hosts'].audit_host}/api/audits/stream\
          /createQuery`"
        discoverRequestHeaders:
          - name: x-api-key
            value: |-
              C.Secret(C.vars['Idira_Secrets'].siem_api_key, 'text').value
          - name: x-cybr-telemetry
            value: |-
              C.Encode.base64(`in=${C.vars['Idira_Telemetry'].integration_name}&it=SIEM&iv=${C.vars['Idira_Telemetry'].integration_version}&vn=${C.vars['Idira_Telemetry'].vendor_name}`).replace(/\+/g,'-').replace(/\//g,'_')
        discoverBody: |-
          {"query": {
            "pageSize": C.vars['Idira_Collection'].page_size,
            "selectedFields": ["tenant_id","custom_data","arrival_timestamp","checksum","application_code","audit_code","timestamp","user_id","session_id","source","action_type","audit_type","component","target","command","message","username","action","uuid","service_name","cloud_roles","cloud_workspaces","cloud_workspaces_and_roles","cloud_assets","cloud_identities","vaulted_accounts","cloud_provider","account_name","target_platform","safe","target_account","identity_type","access_method","account_id","correlation_id"],
            "filterModel": {
              "date": {
                "dateFrom": C.Time.strftime((earliest || (state.latestTime+.001).toPrecision(13)), "%Y-%m-%d %H:%M:%S.%LZ"),
                "dateTo": C.Time.strftime((latest || Date.now()/1000-1), "%Y-%m-%d %H:%M:%S.%LZ")
              },
              ...((C.vars['Idira_Collection'].application_code || []).length ? {"applicationCode": [{"op": "include", "params": C.vars['Idira_Collection'].application_code}]} : {})
            }
          }}
      collectMethod: post_with_body
      pagination:
        type: response_body
        attribute:
          - paging.cursor.cursorRef
        maxPages: 0
        lastPageExpr: ""
        pageField: page
        sizeField: size
        size: 50
        zeroIndexed: false
        offsetField: offset
        limitField: limit
        limit: 50
        nextRelationAttribute: next
      authentication: login
      timeout: 0
      useRoundRobinDns: false
      disableTimeFilter: false
      decodeUrl: false
      rejectUnauthorized: true
      captureHeaders: false
      stopOnEmptyResults: true
      safeHeaders: []
      retryRules:
        type: backoff
        interval: 1000
        limit: 5
        multiplier: 2
        maxIntervalMs: 20000
        codes:
          - 429
          - 503
        enableHeader: true
        retryConnectTimeout: false
        retryConnectReset: false
        retryHeaderName: retry-after
      __scheduling:
        stateTracking: {}
      loginUrl: |-
        `https://${C.vars['CyberArk_Hosts'].identity_host}/oauth2/token/${C.vars['Idira_OAuth'].app_id}`
      loginBody: |-
        `grant_type=client_credentials&scope=${C.vars['Idira_OAuth'].scope}&client_id=${C.Secret(C.vars['Idira_Secrets'].api_key, 'keypair').apiKey}&client_secret=${C.Secret(C.vars['Idira_Secrets'].api_key, 'keypair').secretKey}`
      getAuthTokenFromHeader: false
      authHeaderKey: Authorization
      authHeaderExpr: "`Bearer ${token}`"
      authRequestHeaders:
        - name: x-cybr-telemetry
          value: |-
            C.Encode.base64(`in=${C.vars['Idira_Telemetry'].integration_name}&it=SIEM&iv=${C.vars['Idira_Telemetry'].integration_version}&vn=${C.vars['Idira_Telemetry'].vendor_name}`).replace(/\+/g,'-').replace(/\//g,'_')
      username: changeme
      password: changeme
      tokenRespAttribute: access_token
      collectUrl: "`https://${C.vars['CyberArk_Hosts'].audit_host}/api/audits/stream/\
        results`"
      collectRequestHeaders:
        - name: x-api-key
          value: |-
            C.Secret(C.vars['Idira_Secrets'].siem_api_key, 'text').value
        - name: x-cybr-telemetry
          value: |-
            C.Encode.base64(`in=${C.vars['Idira_Telemetry'].integration_name}&it=SIEM&iv=${C.vars['Idira_Telemetry'].integration_version}&vn=${C.vars['Idira_Telemetry'].vendor_name}`).replace(/\+/g,'-').replace(/\//g,'_')
      collectBody: 'JSON.parse(`{ "cursorRef" : "${cursorRef}"}`)'
    destructive: false
    encoding: utf8
    type: rest
  input:
    type: collection
    staleChannelFlushMs: 10000
    sendToRoutes: true
    preprocess:
      disabled: true
    throttleRatePerSec: "0"
    breakerRulesets:
      - CyberArk_API_Ruleset
  savedState:
    restCollectorState:
      data:
        latestTime: 1770393307.321
  notifications: []
  description: Collects platform-wide audit events from the Idira Audit Service via
    the SIEM Integration API (createQuery / results stream pattern). Job ID is
    retained as cyberark_audit_logs for backward compatibility - see README.
