output: default
streamtags: []
groups: {}
asyncFuncTimeout: 1000
functions:
  - id: serde
    filter: "true"
    conf:
      mode: extract
      type: json
      srcField: _raw
      fieldFilterExpr: value!=null && value!=""
    description: Parse JSON and drop fields with null or blank values
  - id: serialize
    filter: "true"
    disabled: false
    conf:
      type: json
      dstField: _raw
      fields:
        - "!_*"
        - "!cribl*"
        - "*"
    description: Rebuild the _raw value without the null & blank fields that were removed
description: ""
